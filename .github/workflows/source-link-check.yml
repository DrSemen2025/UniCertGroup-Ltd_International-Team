name: Primary source availability

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: read

jobs:
  check-primary-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check critical source links
        shell: bash
        run: |
          set -u

          urls=(
            "https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng"
            "https://eur-lex.europa.eu/eli/dir/2024/2853/oj/eng"
            "https://eur-lex.europa.eu/eli/reg/2023/1230/oj/eng"
            "https://eur-lex.europa.eu/eli/dir/2014/34/oj/eng"
            "https://eur-lex.europa.eu/eli/dir/2014/68/oj/eng"
            "https://digital-strategy.ec.europa.eu/en/policies/cra-summary"
            "https://digital-strategy.ec.europa.eu/en/policies/cra-reporting"
            "https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en"
            "https://single-market-economy.ec.europa.eu/single-market/ce-marking_en"
            "https://eec.eaeunion.org/en/comission/department/deptexreg/tr/"
            "https://moiat.gov.ae/en/"
            "https://www.saso.gov.sa/en/"
            "https://www.enterprisesg.gov.sg/"
            "https://www.cnca.gov.cn/"
            "https://www.meti.go.jp/english/"
            "https://www.safetykorea.kr/"
            "https://www.osha.gov/nationally-recognized-testing-laboratory-program"
            "https://scc-ccn.ca/accreditation"
            "https://misa.gov.sa/"
          )

          failed=0
          for url in "${urls[@]}"; do
            code="$(curl -L --retry 2 --connect-timeout 15 --max-time 60 -sS -o /dev/null -w "%{http_code}" "$url" || true)"
            if [[ "$code" =~ ^(2|3) ]]; then
              echo "OK  $code  $url"
            elif [[ "$code" == "403" ]]; then
              echo "WARN  403  $url — reachable, but automated access is blocked; review manually"
            else
              echo "FAIL  ${code:-000}  $url"
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more primary-source links need manual review."
            exit 1
          fi

          echo "Availability checks passed. Legal content still requires manual expert review."
