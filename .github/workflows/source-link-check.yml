name: Primary source availability

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: write

jobs:
  check-primary-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official-source availability
        run: python scripts/check_regulatory_sources.py
      - name: Publish changed status snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regulatory-source-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update regulatory source status"
            git push
          fi
      - name: Flag unavailable sources
        run: |
          python -c 'import json; data=json.load(open("data/regulatory-source-status.json")); raise SystemExit(1 if data["summary"]["unavailable"] else 0)'
